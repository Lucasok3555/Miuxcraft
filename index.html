<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxel Sandbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="menu-screen" class="screen active">
      <div class="panel menu-panel">
        <h1>Voxel Sandbox</h1>
        <p>Crie, exporte e entre em mundos gerados proceduralmente.</p>
        <div class="create-world">
          <input id="world-name-input" type="text" maxlength="24" placeholder="Nome do mundo">
          <button id="create-world-btn">Criar mundo</button>
        </div>
        <div class="world-actions">
          <button id="export-world-btn" disabled>Exportar mundo</button>
          <button id="online-mode-btn">Modo Online</button>
        </div>
        <div id="world-list" class="world-list"></div>
      </div>
    </section>

    <!-- Modal para configurações -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Configurações</h2>
          <button id="close-modal-btn" class="close-btn">×</button>
        </div>
        <div class="modal-content">
          <button id="survival-mode-btn">Modo Survival</button>
          <button id="creative-mode-btn">Modo Criativo</button>
        </div>
      </div>
    </div>

    <!-- Modal de edição do mundo -->
    <div id="edit-world-modal" class="modal-overlay hidden">
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Editar Mundo</h2>
          <button id="close-edit-modal-btn" class="close-btn">×</button>
        </div>
        <div class="modal-content">
          <input id="edit-world-name" type="text" maxlength="24" placeholder="Novo nome do mundo">
          <button id="save-edit-btn">Salvar</button>
        </div>
      </div>
    </div>

    <section id="game-screen" class="screen">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div id="top-bar">
          <div id="world-status">Dia claro</div>
          <div id="selected-block-label">Bloco: Grama</div>
          <div id="world-name-display">
            <span id="current-world-name"></span>
            <button id="edit-world-name-btn" class="small-btn">✏️</button>
          </div>
          <button id="pause-btn">Sair</button>
        </div>

        <div id="crosshair">+</div>
        <div id="player-hand"></div>

        <!-- Barra de oxigênio -->
        <div id="oxygen-bar" class="hidden">
          <div id="oxygen-fill"></div>
        </div>

        <!-- Chat -->
        <div id="chat-container" class="hidden">
          <div id="chat-messages"></div>
          <input id="chat-input" type="text" placeholder="Digite sua mensagem..." maxlength="100">
        </div>

        <div id="mobile-controls">
          <div id="joystick-zone">
            <div id="joystick-base">
              <div id="joystick-thumb"></div>
            </div>
          </div>
          <div id="mobile-actions">
            <button id="jump-btn" class="round-btn">Pular</button>
            <button id="break-btn" class="round-btn">Quebrar</button>
            <button id="place-btn" class="round-btn">Colocar</button>
            <button id="inventory-btn" class="round-btn">Menu</button>
            <button id="chat-btn" class="round-btn">💬</button>
          </div>
        </div>

        <div id="hotbar"></div>
      </div>

      <div id="inventory-panel" class="overlay-panel hidden">
        <div class="panel">
          <div class="panel-header">
            <h2>Banco de blocos</h2>
            <button id="close-inventory-btn">Fechar</button>
          </div>
          <div id="inventory-grid" class="inventory-grid"></div>
        </div>
      </div>

      <div id="pause-panel" class="overlay-panel hidden">
        <div class="panel">
          <h2>Menu do jogo</h2>
          <button id="save-exit-btn">Salvar e sair</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
